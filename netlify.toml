[build]
  functions = "netlify/functions"
[functions]
  node_bundler = "esbuild"
[[redirects]]
  from = "/api/webhooks/whatsapp"
  to = "/.netlify/functions/whatsapp"
  status = 200
[[redirects]]
  from = "/health"
  to = "/.netlify/functions/health"
  status = 200

[[redirects]]
  from = "/go/book"
  to = "/.netlify/functions/booking-click"
  status = 200
[[redirects]]
  from = "/admin"
  to = "/.netlify/functions/admin"
  status = 200
